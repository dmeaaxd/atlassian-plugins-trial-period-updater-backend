<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка плагинов</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0; background: #f2f4f7; color: #17202a;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .last-update {
    display: inline-block; background: #e8f0fe; color: #1a56db;
    border-radius: 8px; padding: 6px 12px; font-size: 13px; margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eceff3; vertical-align: top; font-size: 13px; }
  th { text-align: left; background: #f8fafc; color: #4b5563; font-weight: 600; white-space: nowrap; }
  input, select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff;
  }
  textarea { min-height: 64px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .time { color: #6b7280; white-space: nowrap; font-size: 12px; }
  button {
    border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .btn-save { background: #1a56db; color: #fff; }
  .btn-save:hover { background: #1e40af; }
  .btn-add { background: #059669; color: #fff; margin-top: 14px; }
  .btn-add:hover { background: #047857; }
  .btn-del { background: #fee2e2; color: #b91c1c; }
  .btn-del:hover { background: #fecaca; }
  .actions { white-space: nowrap; }
  .actions button { margin-right: 6px; }
  .login {
    max-width: 340px; margin: 120px auto 0; background: #fff; border-radius: 12px;
    padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .login h1 { margin-bottom: 16px; }
  .login input { margin-bottom: 12px; }
  .login .err { color: #b91c1c; font-size: 13px; margin-top: 10px; }
  .hidden { display: none; }
  .badge {
    display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 600;
  }
  .badge-jira { background: #0052cc22; color: #0052cc; }
  .badge-confluence { background: #2684ff22; color: #0052cc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="login hidden" id="login">
    <h1>Админка</h1>
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
    <button class="btn-save" id="loginBtn" style="width:100%">Войти</button>
    <div class="err hidden" id="loginErr">Неверный пароль</div>
  </div>

  <div id="app" class="hidden">
    <h1>Плагины</h1>
    <div class="sub">Изменения сохраняются в базу сразу, дата обновления проставляется автоматически</div>
    <div class="last-update" id="lastUpdate"></div>
    <table>
      <thead>
        <tr>
          <th style="width:30%">Название</th>
          <th style="width:12%">Тип</th>
          <th style="width:28%">Путь к иконке</th>
          <th style="width:30%">API-ключ</th>
          <th>Обновлён (МСК)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <button class="btn-add" id="addBtn">+ Добавить плагин</button>
  </div>
</div>

<script>
const state = { password: null, plugins: [] };

const $ = (id) => document.getElementById(id);
const loginEl = $('login'), appEl = $('app');

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'X-Admin-Password': state.password, ...(options.headers || {}) },
  });
  if (res.status === 401) { showLogin(); throw new Error('unauthorized'); }
  if (!res.ok) { const t = await res.text(); throw new Error(t || res.status); }
  return res.status === 204 ? null : res.json();
}

function fmtMsk(value) {
  if (!value) return '—';
  const d = new Date(value + 'Z');
  return d.toLocaleString('ru-RU', {
    timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }) + ' MSK';
}

function rowEl(plugin) {
  const tr = document.createElement('tr');

  const nameTd = document.createElement('td');
  const name = document.createElement('input');
  name.value = plugin.name;
  nameTd.append(name);

  const typeTd = document.createElement('td');
  const type = document.createElement('select');
  ['JIRA', 'CONFLUENCE'].forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t === 'JIRA' ? 'Jira' : 'Confluence';
    if (t === plugin.type) opt.selected = true;
    type.append(opt);
  });
  typeTd.append(type);

  const pathTd = document.createElement('td');
  const path = document.createElement('input');
  path.value = plugin.image_hard_path;
  pathTd.append(path);

  const keyTd = document.createElement('td');
  const key = document.createElement('textarea');
  key.value = plugin.api_key;
  keyTd.append(key);

  const timeTd = document.createElement('td');
  timeTd.className = 'time';
  timeTd.textContent = fmtMsk(plugin.updated_at);

  const actionsTd = document.createElement('td');
  actionsTd.className = 'actions';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn-save';
  saveBtn.textContent = 'Сохранить';
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    try {
      const body = {
        name: name.value.trim(),
        type: type.value,
        image_hard_path: path.value.trim(),
        api_key: key.value.trim(),
      };
      const saved = plugin.id
        ? await api(`api/plugins/${plugin.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        : await api('api/plugins', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      await reload();
      highlight(saved.id);
    } catch (e) {
      alert('Ошибка сохранения: ' + e.message);
    } finally {
      saveBtn.disabled = false;
    }
  };
  actionsTd.append(saveBtn);

  if (plugin.id) {
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.textContent = 'Удалить';
    delBtn.onclick = async () => {
      if (!confirm('Удалить плагин «' + plugin.name + '»?')) return;
      try {
        await api(`api/plugins/${plugin.id}`, { method: 'DELETE' });
        await reload();
      } catch (e) {
        alert('Ошибка удаления: ' + e.message);
      }
    };
    actionsTd.append(delBtn);
  }

  tr.append(nameTd, typeTd, pathTd, keyTd, timeTd, actionsTd);
  return tr;
}

function highlight(id) {
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if (!tr) return;
  tr.style.background = '#ecfdf5';
  setTimeout(() => { tr.style.background = ''; }, 1500);
}

async function reload() {
  const plugins = await api('api/plugins');
  state.plugins = plugins;
  const rows = $('rows');
  rows.textContent = '';
  plugins.forEach((p) => {
    const tr = rowEl(p);
    tr.dataset.id = p.id;
    rows.append(tr);
  });
  const last = plugins
    .map((p) => p.updated_at)
    .filter(Boolean)
    .map((v) => new Date(v + 'Z').getTime())
    .reduce((a, b) => Math.max(a, b), 0);
  $('lastUpdate').textContent = 'Последнее обновление базы: ' +
    (last ? new Date(last).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' MSK' : '—');
}

function showLogin() {
  appEl.classList.add('hidden');
  loginEl.classList.remove('hidden');
  $('pass').focus();
}

$('loginBtn').onclick = async () => {
  state.password = $('pass').value;
  $('loginErr').classList.add('hidden');
  try {
    await reload();
    loginEl.classList.add('hidden');
    appEl.classList.remove('hidden');
  } catch (e) {
    $('loginErr').classList.remove('hidden');
    state.password = null;
  }
};
$('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

$('addBtn').onclick = () => {
  const tr = rowEl({ name: '', type: 'JIRA', image_hard_path: 'icons/jira_plugins/', api_key: '', updated_at: null });
  tr.dataset.id = 'new';
  $('rows').prepend(tr);
  tr.querySelector('input').focus();
};

showLogin();
</script>
</body>
</html>
