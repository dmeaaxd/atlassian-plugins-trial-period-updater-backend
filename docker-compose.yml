services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Локальная БД пробрасывается в контейнер как есть: данные «перетекают»
      # из локальной сборки, ничего не создаётся заново. Файл всегда существует,
      # поэтому seed/пересоздание таблиц не запускается.
      - ./database.db:/app/database.db
    restart: unless-stopped
